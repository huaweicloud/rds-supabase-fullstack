[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-huaweicloud-rds-supabase"
version = "0.4.0"
description = "Huawei Cloud RDS Supabase (self-hosted) management MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["mcp", "huaweicloud", "supabase", "postgresql", "rds", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "huaweicloud-mcp-core>=1.0,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
mcp-server-huaweicloud-rds-supabase = "mcp_server_rds_supabase.main:main"

[dependency-groups]
dev = ["pytest>=8.0,<10", "pytest-asyncio>=0.23,<2", "pytest-cov>=5.0,<8",
       "ruff>=0.6,<1", "mypy>=1.10,<2", "build>=1.2,<2",
       "types-PyYAML>=6.0,<7"]

[tool.uv.sources]
huaweicloud-mcp-core = { path = "../../libs/huaweicloud_mcp_core" }

[tool.uv]
constraint-dependencies = [
  "huaweicloudsdkcore==3.1.220",
  "huaweicloudsdkiam==3.1.220",
  "typing-inspection==0.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_rds_supabase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
markers = ["live: calls a live RDS Supabase instance and may change data when explicitly enabled"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The embedded DDL must stay byte-identical to sql/mcp-execute-sql.sql
"src/mcp_server_rds_supabase/client/rds_supabase_client.py" = ["E501"]
# Tool docstrings start with the upstream description text, kept verbatim
"src/mcp_server_rds_supabase/tools/*.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
