[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-huaweicloud-rds-supabase"
version = "0.4.4"
description = "Data-plane MCP server for Huawei Cloud RDS Supabase: SQL execution, schema inspection, auth-user management, storage and security checks via the Kong gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["mcp", "huaweicloud", "supabase", "postgresql", "rds", "database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "huaweicloud-mcp-core>=1.0,<2",
  "httpx>=0.27,<1",
  # Supply-chain floor: huaweicloudsdkcore<=3.1.218 transitively pins
  # pyasn1<=0.6.3 (3 DoS CVEs: CVE-2026-59884/59885/59886). The local
  # tool.uv override cannot propagate into published metadata, so the
  # floor is declared explicitly here for PyPI installs.
  "pyasn1>=0.6.4",
]

[project.scripts]
mcp-server-huaweicloud-rds-supabase = "mcp_server_rds_supabase.main:main"

[dependency-groups]
dev = ["pytest>=8.0,<10", "pytest-asyncio>=0.23,<2", "pytest-cov>=5.0,<8",
       "ruff>=0.6,<1", "mypy>=1.10,<2", "build>=1.2,<2",
       "types-PyYAML>=6.0,<7"]

[tool.uv.sources]
huaweicloud-mcp-core = { path = "../../libs/huaweicloud_mcp_core" }

[tool.uv]
# Historical pin note: huaweicloudsdkcore==3.1.220 was constrained here to dodge
# its transitive pyasn1<=0.6.3 pin (3 DoS CVEs). The fix now lives in
# [project].dependencies as an explicit pyasn1>=0.6.4 floor that propagates into
# published metadata, so the exact-pin constraints are removed: the resolver is
# free to pick sdkcore>=3.1.223 whose pyasn1 range (<0.7.0,>=0.5.0) accepts
# the floor. typing-inspection pin dropped along (was only needed to keep the
# 3.1.220 resolution stable).

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_rds_supabase"]

[tool.hatch.build.targets.sdist]
only-include = ["src/mcp_server_rds_supabase", "sql", "README.md", "README_zh.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
markers = ["live: calls a live RDS Supabase instance and may change data when explicitly enabled"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The embedded DDL must stay byte-identical to sql/mcp-execute-sql.sql
"src/mcp_server_rds_supabase/client/rds_supabase_client.py" = ["E501"]
# Tool docstrings start with the upstream description text, kept verbatim
"src/mcp_server_rds_supabase/tools/*.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
