[project]
name = "mcp_server_supabase"
version = "0.4.0a30"
license = "MIT"
readme = "README.md"
description = "Supabase management API adapters and scenario tools"
requires-python = ">=3.10"
dependencies = [
  "huaweicloud-mcp-core>=1.0,<2",
  "mcp>=2.0",
  "huaweicloudsdkcore>=3.1.220,<4",
  "huaweicloudsdkbss>=3.1.218,<4",
  "huaweicloudsdkiam>=3.1.220,<4",
]
[project.scripts]
mcp_server_supabase = "mcp_server_supabase.main:main"
mcp-huaweicloud-rds-supabase-mgr = "mcp_server_supabase.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_supabase"]
[tool.uv.sources]
huaweicloud-mcp-core = { path = "../../libs/huaweicloud_mcp_core" }

[tool.uv]
constraint-dependencies = [
  "huaweicloudsdkcore==3.1.220",
  "huaweicloudsdkiam==3.1.220",
  "typing-inspection==0.4.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "coverage>=7.10,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_server_supabase --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["mcp_server_supabase"]
patch = ["subprocess"]
relative_files = true
