<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="900" fill="#FFFFFF"/>

  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">全托管新模式 · 前后端全托管（Supabase + OBS）</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#475569">后端收敛为一个 Supabase 实例；两个声明式产物，托管层承接部署与运维</text>

  <!-- ======== 开发态 ======== -->
  <rect x="20" y="90" width="920" height="160" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
  <rect x="36" y="104" width="76" height="26" rx="13" fill="#4338CA"/>
  <text x="74" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">开发态</text>
  <text x="124" y="121" font-size="9.5" letter-spacing="2" fill="#94A3B8">DEVELOPMENT</text>
  <text x="924" y="121" text-anchor="end" font-size="11.5" font-weight="700" fill="#15803D">开发周期：数天级</text>

  <rect x="50" y="142" width="400" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="396" y="148" width="48" height="18" rx="9" fill="#DCFCE7"/>
  <text x="420" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">声明式</text>
  <text x="250" y="168" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">前端 · 开发</text>
  <text x="250" y="192" text-anchor="middle" font-size="11" fill="#475569">技术栈：React / Vue · supabase-js</text>
  <text x="250" y="212" text-anchor="middle" font-size="11" fill="#475569">工具链：npm · Vite（与传统模式一致）</text>
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#475569">产物：静态构建包（直传 OBS）</text>

  <rect x="510" y="142" width="400" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="856" y="148" width="48" height="18" rx="9" fill="#DCFCE7"/>
  <text x="880" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">声明式</text>
  <text x="710" y="168" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">后端 · 开发</text>
  <text x="710" y="192" text-anchor="middle" font-size="11" fill="#475569">产出：init.sql —— 后端即数据层</text>
  <text x="710" y="212" text-anchor="middle" font-size="11" fill="#475569">内容：表 · GRANT · RLS · RPC</text>
  <text x="710" y="232" text-anchor="middle" font-size="11" fill="#475569">无应用代码 · 无 ORM · 无自研鉴权</text>

  <line x1="250" y1="238" x2="250" y2="268" stroke="#64748B" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="258" y="259" font-size="10.5" fill="#475569">npm run build</text>
  <line x1="710" y1="238" x2="710" y2="268" stroke="#64748B" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="718" y="259" font-size="10.5" fill="#475569">execute_sql 单事务</text>

  <!-- ======== 部署态 ======== -->
  <rect x="20" y="272" width="920" height="170" rx="14" fill="#FFF7E6" stroke="#FDE68A"/>
  <rect x="36" y="286" width="76" height="26" rx="13" fill="#B45309"/>
  <text x="74" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">部署态</text>
  <text x="124" y="303" font-size="9.5" letter-spacing="2" fill="#94A3B8">DEPLOYMENT</text>
  <text x="924" y="303" text-anchor="end" font-size="11.5" font-weight="700" fill="#15803D">部署流程：一句话触发 · 8 步声明式 · 小时级</text>

  <rect x="50" y="324" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="396" y="330" width="48" height="18" rx="9" fill="#DCFCE7"/>
  <text x="420" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">云托管</text>
  <text x="250" y="370" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">前端 · 部署</text>
  <text x="250" y="392" text-anchor="middle" font-size="11" fill="#475569">构建产物直传 OBS 公开桶</text>
  <text x="250" y="412" text-anchor="middle" font-size="11" fill="#475569">无服务器 · 无 nginx · 无运行时</text>
  <text x="250" y="430" text-anchor="middle" font-size="11" fill="#475569">CDN 加速与缓存（可选）</text>

  <rect x="510" y="324" width="400" height="108" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="856" y="330" width="48" height="18" rx="9" fill="#DCFCE7"/>
  <text x="880" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">云托管</text>
  <text x="710" y="370" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">后端 · 部署</text>
  <text x="710" y="392" text-anchor="middle" font-size="11" fill="#475569">execute_sql · 单事务五步 · sha256 留痕</text>
  <text x="710" y="412" text-anchor="middle" font-size="11" fill="#475569">实例 + EIP / 安全组 · 一次配置</text>
  <text x="710" y="430" text-anchor="middle" font-size="11" fill="#475569">gate 机器核验 · 直连云验证</text>

  <line x1="250" y1="432" x2="250" y2="462" stroke="#64748B" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="258" y="453" font-size="10.5" fill="#475569">直传生效</text>
  <line x1="710" y1="432" x2="710" y2="462" stroke="#64748B" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="718" y="453" font-size="10.5" fill="#475569">发布生效</text>

  <!-- ======== 运行态 ======== -->
  <rect x="20" y="466" width="920" height="360" rx="14" fill="#ECFDF5" stroke="#BBF7D0"/>
  <rect x="36" y="480" width="76" height="26" rx="13" fill="#15803D"/>
  <text x="74" y="497" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">运行态</text>
  <text x="124" y="497" font-size="9.5" letter-spacing="2" fill="#94A3B8">RUNTIME</text>

  <rect x="420" y="492" width="120" height="44" rx="22" fill="#0F172A"/>
  <text x="480" y="519" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">用户</text>
  <line x1="430" y1="536" x2="250" y2="556" stroke="#64748B" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="300" y="543" text-anchor="middle" font-size="10.5" fill="#475569">静态资源</text>
  <line x1="530" y1="536" x2="710" y2="556" stroke="#64748B" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="640" y="541" text-anchor="middle" font-size="10.5" fill="#475569">API · 数据</text>

  <rect x="50" y="560" width="400" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="396" y="566" width="48" height="18" rx="9" fill="#DCFCE7"/>
  <text x="420" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">云托管</text>
  <text x="250" y="590" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">前端 · 运行</text>
  <text x="250" y="614" text-anchor="middle" font-size="11" fill="#475569">CDN → OBS 静态桶（公开读）</text>
  <text x="250" y="634" text-anchor="middle" font-size="11" fill="#15803D">0 服务器 · 0 nginx · 0 运行时</text>

  <rect x="510" y="560" width="400" height="180" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
  <rect x="852" y="566" width="48" height="18" rx="9" fill="#DCFCE7"/>
  <text x="876" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#15803D">云托管</text>
  <text x="700" y="592" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">后端 · 1 个实体：Supabase 实例</text>

  <rect x="526" y="608" width="180" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="616" y="630" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Kong 网关</text>
  <rect x="714" y="608" width="180" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="804" y="630" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Postgres · GoTrue</text>

  <text x="710" y="668" text-anchor="middle" font-size="11" fill="#475569">RLS 行级安全 · RPC · advisors 机器体检</text>
  <text x="710" y="690" text-anchor="middle" font-size="11" fill="#475569">实例自带网关与鉴权 · 备份托管</text>
  <text x="710" y="712" text-anchor="middle" font-size="11" fill="#475569">Kong 网关 + Postgres 同属一个托管实例</text>

  <line x1="710" y1="740" x2="710" y2="750" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah2)"/>

  <rect x="510" y="752" width="400" height="58" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="6 4"/>
  <text x="710" y="776" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">FunctionGraph（可选）</text>
  <text x="710" y="796" text-anchor="middle" font-size="10.5" fill="#475569">交易通知 · 外部对接 · 免运维 · 按量计费</text>

  <!-- ======== 度量汇总 ======== -->
  <rect x="20" y="840" width="920" height="46" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="480" y="868" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">开发周期 数天 · 部署 8 步声明式 · 前端 0 服务器 · 后端 1 个实体 —— 声明式产物 + 机器核验</text>
