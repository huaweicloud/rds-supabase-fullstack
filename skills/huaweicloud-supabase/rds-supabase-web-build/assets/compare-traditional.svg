  <rect x="0" y="0" width="920" height="810" fill="#FFFFFF"/>

  <text x="460" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">传统开发模式 · 全链路自建自管</text>
  <text x="460" y="66" text-anchor="middle" font-size="12" fill="#475569">前端、后端两套代码库；后端 = 后端服务 → 数据库，每层都要开发、构建、采购、配置、部署、运维</text>

  <!-- ======== 开发态 ======== -->
  <rect x="20" y="90" width="880" height="140" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
